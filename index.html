<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>I am climbing barricades in empty street at night</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500&display=swap">
<style>
  :root {
    --bg: #eceef2;
    --surface: #f7f8fa;
    --ink: #161b26;
    --muted: #5a6273;
    --line: #c9ceda;
    --accent: #2c5a8c;
    --accent-ink: #ffffff;
    --track: #d3d8e2;
    --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #10141c;
      --surface: #171c27;
      --ink: #e8ebf2;
      --muted: #97a0b3;
      --line: #2b3242;
      --accent: #8fb6e3;
      --accent-ink: #10141c;
      --track: #2b3242;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #10141c;
    --surface: #171c27;
    --ink: #e8ebf2;
    --muted: #97a0b3;
    --line: #2b3242;
    --accent: #8fb6e3;
    --accent-ink: #10141c;
    --track: #2b3242;
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.5;
    padding-inline: 20px;
    padding-block: 24px;
    display: grid;
    place-items: center;
  }
  main {
    width: 100%;
    max-width: 30rem;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .note {
    font-size: 1.0625rem;
    color: var(--muted);
    max-width: 34ch;
  }
  .note strong { color: var(--ink); font-weight: 500; }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2rem, 9vw, 3rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
    text-wrap: balance;
    margin: 0;
  }
  .player {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .play {
    flex: none;
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 0;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid; place-items: center;
    cursor: pointer;
  }
  .play:focus-visible, .seek:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .play svg { width: 22px; height: 22px; fill: currentColor; }
  .play .i-pause { display: none; }
  .playing .play .i-play { display: none; }
  .playing .play .i-pause { display: block; }
  .track { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .seek {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 22px; margin: 0;
    background: transparent; cursor: pointer;
    --pos: 0%;
  }
  .seek::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(to right, var(--accent) var(--pos), var(--track) var(--pos));
  }
  .seek::-moz-range-track { height: 4px; border-radius: 2px; background: var(--track); }
  .seek::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
  .seek::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: 0; margin-top: -6px;
  }
  .seek::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 0; }
  .times {
    display: flex; justify-content: space-between;
    font-size: 0.875rem; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .nojs { font-size: 0.9rem; color: var(--muted); }
  @media (prefers-reduced-motion: no-preference) {
    .play { transition: transform 0.12s ease; }
    .play:active { transform: scale(0.94); }
  }
</style>
</head>
<body>
<main>
  <h1>I am climbing barricades in empty street at night</h1>

  <div class="player" id="player">
    <button class="play" id="play" type="button" aria-label="Afspelen">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg>
    </button>
    <div class="track">
      <input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="Positie in het liedje">
      <div class="times"><span id="cur">0:00</span><span id="dur">4:05</span></div>
    </div>
  </div>

  <audio id="audio" preload="metadata" src="Riot_On_An_Empty_Street.mp3" controls></audio>
</main>

<script>
  (function () {
    var audio = document.getElementById('audio');
    var player = document.getElementById('player');
    var play = document.getElementById('play');
    var seek = document.getElementById('seek');
    var cur = document.getElementById('cur');
    var dur = document.getElementById('dur');
    var dragging = false;

    // Eigen bediening vervangt de standaardspeler zodra de pagina geladen is.
    audio.removeAttribute('controls');
    audio.hidden = true;

    function fmt(s) {
      if (!isFinite(s)) return '0:00';
      var m = Math.floor(s / 60), r = Math.floor(s % 60);
      return m + ':' + (r < 10 ? '0' : '') + r;
    }
    function paint() {
      var d = audio.duration || 0;
      var p = d ? (audio.currentTime / d) * 1000 : 0;
      if (!dragging) seek.value = p;
      seek.style.setProperty('--pos', (p / 10) + '%');
      cur.textContent = fmt(audio.currentTime);
    }
    audio.addEventListener('loadedmetadata', function () { dur.textContent = fmt(audio.duration); });
    audio.addEventListener('timeupdate', paint);
    audio.addEventListener('play', function () {
      player.classList.add('playing'); play.setAttribute('aria-label', 'Pauzeren');
    });
    audio.addEventListener('pause', function () {
      player.classList.remove('playing'); play.setAttribute('aria-label', 'Afspelen');
    });
    audio.addEventListener('ended', function () { audio.currentTime = 0; paint(); });

    play.addEventListener('click', function () {
      if (audio.paused) { audio.play(); } else { audio.pause(); }
    });
    seek.addEventListener('input', function () {
      dragging = true;
      var d = audio.duration || 0;
      seek.style.setProperty('--pos', (seek.value / 10) + '%');
      cur.textContent = fmt((seek.value / 1000) * d);
    });
    seek.addEventListener('change', function () {
      var d = audio.duration || 0;
      audio.currentTime = (seek.value / 1000) * d;
      dragging = false;
    });
  })();
</script>
</body>
</html>
