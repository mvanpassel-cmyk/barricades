<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1224">
<title>I am climbing barricades in empty streets at night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Figtree:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --night: #0b1224;
    --paper: #f7ecd4;
    --muted: rgba(247, 236, 212, 0.68);
    --lamp: #f1b65e;
    --lamp-ink: #1c1206;
    --glass: rgba(9, 15, 30, 0.58);
    --glass-line: rgba(247, 213, 150, 0.2);
    --font-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--paper);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
  }

  .scene {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--night);
    container-type: size;
  }
  /* The photo is drawn "cover", anchored 30% / 50%. Everything that moves sits
     inside this stage, so it stays locked to the picture at any screen size. */
  .stage {
    --w: max(100vw, 150vh);
    position: absolute;
    width: var(--w);
    height: calc(var(--w) / 1.5);
    left: calc((100vw - var(--w)) * 0.3);
    top: calc((100vh - var(--w) / 1.5) * 0.5);
  }
  @supports (width: 1cqw) {
    .stage {
      --w: max(100cqw, 150cqh);
      left: calc((100cqw - var(--w)) * 0.3);
      top: calc((100cqh - var(--w) / 1.5) * 0.5);
    }
  }
  .photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    user-select: none;
  }

  /* Clouds: soft wisps that drift behind the tree and rooftops. The mask is
     built from the photo itself (see script), so they only show in the sky. */
  .sky {
    position: absolute;
    inset: 0;
    overflow: hidden;
    opacity: 0;
    transition: opacity 2s ease;
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
  }
  .sky.ready { opacity: 1; }
  .cloud {
    position: absolute;
    left: 40%;
    top: var(--y);
    width: var(--wd);
    height: var(--h);
    opacity: var(--o);
    background:
      radial-gradient(ellipse 34% 60% at 22% 58%, rgba(104, 146, 204, 0.75), transparent 72%),
      radial-gradient(ellipse 30% 70% at 50% 42%, rgba(104, 146, 204, 0.65), transparent 72%),
      radial-gradient(ellipse 28% 55% at 78% 60%, rgba(104, 146, 204, 0.6), transparent 72%);
    will-change: transform;
    animation: drift var(--dur) linear var(--delay) infinite;
  }
  @keyframes drift {
    from { transform: translateX(-80%); }
    to   { transform: translateX(150%); }
  }

  .star {
    position: absolute;
    width: 0.5%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 244, 220, 0.95), rgba(255, 244, 220, 0) 70%);
    mix-blend-mode: screen;
    animation: twinkle var(--dur) ease-in-out var(--delay) infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; }
    45% { opacity: 0.85; }
    60% { opacity: 0.35; }
  }

  /* Lamp light: a warm glow that surges and dips, a darker veil that dips
     when the glow does, and a much softer wash over the lit wall. */
  .lamp-glow, .lamp-dim, .wall-glow {
    position: absolute;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .lamp-glow {
    left: 32.4%;
    top: 16.8%;
    width: 22%;
    aspect-ratio: 1;
    background: radial-gradient(circle, rgba(255, 208, 120, 0.85) 0%, rgba(255, 170, 70, 0.4) 34%, rgba(255, 150, 50, 0) 70%);
    mix-blend-mode: screen;
    opacity: 0.55;
    animation: flicker 18s linear infinite;
  }
  .lamp-dim {
    left: 32.4%;
    top: 16.8%;
    width: 40%;
    aspect-ratio: 1;
    background: radial-gradient(circle, rgba(6, 10, 24, 0.55) 0%, rgba(6, 10, 24, 0.25) 40%, rgba(6, 10, 24, 0) 70%);
    opacity: 0;
    animation: dip 18s linear infinite;
  }
  .wall-glow {
    left: 33%;
    top: 42%;
    width: 34%;
    aspect-ratio: 1 / 1.5;
    background: radial-gradient(ellipse, rgba(255, 160, 60, 0.32) 0%, rgba(255, 140, 40, 0.12) 45%, rgba(255, 140, 40, 0) 70%);
    mix-blend-mode: screen;
    opacity: 0.55;
    animation: flicker-soft 18s linear infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: 0.6; }
    3%   { opacity: 0.25; }
    5%   { opacity: 0.9; }
    8%   { opacity: 0.55; }
    22%  { opacity: 0.7; }
    24%  { opacity: 0.15; }
    25.5%{ opacity: 0.85; }
    27%  { opacity: 0.4; }
    30%  { opacity: 0.62; }
    48%  { opacity: 0.72; }
    52%  { opacity: 0.55; }
    70%  { opacity: 0.68; }
    71.5%{ opacity: 0.1; }
    73%  { opacity: 0.88; }
    74.5%{ opacity: 0.35; }
    77%  { opacity: 0.62; }
    90%  { opacity: 0.55; }
  }
  @keyframes dip {
    0%, 100% { opacity: 0; }
    3%   { opacity: 0.55; }
    5%   { opacity: 0; }
    24%  { opacity: 0.7; }
    25.5%{ opacity: 0; }
    27%  { opacity: 0.35; }
    30%  { opacity: 0; }
    71.5%{ opacity: 0.8; }
    73%  { opacity: 0; }
    74.5%{ opacity: 0.45; }
    77%  { opacity: 0; }
  }
  @keyframes flicker-soft {
    0%, 100% { opacity: 0.55; }
    3%   { opacity: 0.42; }
    5%   { opacity: 0.6; }
    24%  { opacity: 0.4; }
    25.5%{ opacity: 0.6; }
    40%  { opacity: 0.62; }
    52%  { opacity: 0.5; }
    71.5%{ opacity: 0.38; }
    73%  { opacity: 0.6; }
    85%  { opacity: 0.58; }
  }

  /* Tree: a duplicate sliver of the same photo, masked to the canopy only,
     rocking very slightly from its base like an occasional light gust. */
  .tree-sway {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    user-select: none;
    transform-origin: 51% 43%;
    -webkit-mask-image: radial-gradient(ellipse 11% 19% at 51% 25%, #fff 0%, #fff 45%, transparent 88%);
    mask-image: radial-gradient(ellipse 11% 19% at 51% 25%, #fff 0%, #fff 45%, transparent 88%);
    animation: sway 8s ease-in-out infinite;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-0.35deg); }
    50%      { transform: rotate(0.35deg); }
  }

  /* Chimney smoke: a few faint puffs drifting up and thinning out. Kept
     close to the chimney (small size, short rise, base anchored low in
     the puff) so it stays inside the visible frame even on wide windows,
     where the cover-fit crop leaves little headroom above the rooftop. */
  .smoke-puff {
    position: absolute;
    left: 76%;
    top: 7.6%;
    width: 2.2%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(224, 232, 244, 0.85), rgba(224, 232, 244, 0) 72%);
    filter: blur(1px);
    opacity: 0;
    pointer-events: none;
    animation: rise var(--dur) ease-out var(--delay) infinite;
  }
  @keyframes rise {
    0%   { transform: translate(-50%, -30%) scale(0.55); opacity: 0; }
    12%  { opacity: 0.64; }
    50%  { opacity: 0.24; }
    100% { transform: translate(calc(-50% + 0.7em), calc(-30% - 1em)) scale(1.05); opacity: 0; }
  }

  /* The one lit window down the street: a duplicate sliver of the same photo,
     masked exactly to the window and dimmed with it once the song ends --
     so the glass itself goes dark rather than a shape pasted over the wall. */
  .window-dark {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    user-select: none;
    -webkit-mask-image: radial-gradient(ellipse 0.46% 1.3% at 65.1% 59.3%, #fff 0%, #fff 78%, transparent 100%);
    mask-image: radial-gradient(ellipse 0.46% 1.3% at 65.1% 59.3%, #fff 0%, #fff 78%, transparent 100%);
    filter: brightness(0.24) saturate(0.75);
    opacity: 0;
    transition: opacity 2.8s ease;
  }
  .window-dark.dimming { opacity: 1; }

  /* A falling star, now and then, somewhere quiet in the sky. */
  .shooting-star {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: #fff8ea;
    box-shadow: 0 0 5px 1px rgba(255, 248, 234, 0.85);
    opacity: 0;
    pointer-events: none;
    animation: shoot 1.15s ease-out forwards;
  }
  .shooting-star::after {
    content: "";
    position: absolute;
    top: 50%;
    right: 50%;
    width: 42px;
    height: 1px;
    background: linear-gradient(to left, rgba(255, 248, 234, 0.75), transparent);
    transform: translateY(-50%) rotate(28deg);
    transform-origin: right center;
  }
  @keyframes shoot {
    0%   { opacity: 0; transform: translate(0, 0); }
    10%  { opacity: 1; }
    78%  { opacity: 0.8; }
    100% { opacity: 0; transform: translate(calc(8vw * var(--scale, 1)), calc(4.2vw * var(--scale, 1))); }
  }

  .veil {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to top, rgba(7, 12, 26, 0.86) 0%, rgba(7, 12, 26, 0.35) 42%, rgba(7, 12, 26, 0) 70%);
  }

  main {
    position: relative;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 22px;
    width: 100%;
    max-width: 34rem;
    margin-inline: auto;
    padding-inline: 20px;
    padding-block: 32px 44px;
  }

  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 600;
    font-size: clamp(2.3rem, 10.5vw, 3.6rem);
    line-height: 1.05;
    letter-spacing: -0.005em;
    text-wrap: balance;
    color: var(--paper);
    text-shadow: 0 2px 24px rgba(5, 9, 20, 0.7);
  }

  .player {
    display: inline-flex;
    align-self: flex-start;
    padding: 9px;
    background: var(--glass);
    border: 1px solid var(--glass-line);
    border-radius: 999px;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  .play {
    flex: none;
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 50%;
    background: var(--lamp);
    color: var(--lamp-ink);
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: 0 0 0 0 rgba(241, 182, 94, 0);
    transition: box-shadow 0.4s ease, transform 0.12s ease;
  }
  .play:active { transform: scale(0.94); }
  .play:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
  .play svg { width: 17px; height: 17px; fill: currentColor; }
  .play .i-pause { display: none; }
  .playing .play .i-play { display: none; }
  .playing .play .i-pause { display: block; }
  .playing .play { animation: breathe 4.5s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 16px 3px rgba(241, 182, 94, 0.32); }
    50%      { box-shadow: 0 0 27px 5px rgba(241, 182, 94, 0.52); }
  }

  @media (min-width: 900px) {
    main {
      margin-inline: auto 8vw;
      justify-content: center;
      padding-block: 48px;
    }
    .veil {
      background:
        linear-gradient(to left, rgba(7, 12, 26, 0.6) 0%, rgba(7, 12, 26, 0) 55%),
        linear-gradient(to top, rgba(7, 12, 26, 0.5) 0%, rgba(7, 12, 26, 0) 40%);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .play { transition: none; }
    .cloud, .star, .lamp-glow, .lamp-dim, .wall-glow { animation: none; }
    .sky { display: none; }
    .playing .play { animation: none; box-shadow: 0 0 22px 4px rgba(241, 182, 94, 0.45); }
    .tree-sway, .smoke-puff { animation: none; }
    .tree-sway { display: none; }
    .smoke-puff { display: none; }
    .shooting-star { display: none; }
    .window-dark { transition: none; }
  }
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
  <div class="stage">
    <img class="photo" id="photo" src="image.png" alt="" decoding="async">
    <img class="tree-sway" src="image.png" alt="" decoding="async" aria-hidden="true">
    <div class="sky" id="sky">
      <i class="cloud" style="--y: 3%;  --wd: 30%; --h: 12%; --o: 0.5; --dur: 150s; --delay: -60s"></i>
      <i class="cloud" style="--y: 14%; --wd: 38%; --h: 13%; --o: 0.42; --dur: 210s; --delay: -170s"></i>
      <i class="cloud" style="--y: 23%; --wd: 26%; --h: 9%;  --o: 0.46; --dur: 125s; --delay: -20s"></i>
    </div>
    <i class="star" style="left: 61%; top: 5.7%;  --dur: 5s;   --delay: -1s"></i>
    <i class="star" style="left: 66.5%; top: 9.9%; --dur: 7s;   --delay: -3s"></i>
    <i class="star" style="left: 68.9%; top: 18%;  --dur: 6s;   --delay: -2s"></i>
    <div class="wall-glow"></div>
    <div class="lamp-glow"></div>
    <div class="lamp-dim"></div>
    <i class="smoke-puff" style="--dur: 7s; --delay: 0s"></i>
    <i class="smoke-puff" style="left: 76.4%; --dur: 7s; --delay: -2.3s"></i>
    <i class="smoke-puff" style="left: 75.7%; --dur: 7s; --delay: -4.6s"></i>
    <img class="window-dark" id="windowDim" src="image.png" alt="" decoding="async" aria-hidden="true">
  </div>
  <div class="veil"></div>
</div>

<main>
  <h1>I am climbing barricades in empty streets at night</h1>

  <div class="player" id="player">
    <button class="play" id="play" type="button" aria-label="Afspelen">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg>
    </button>
  </div>

  <audio id="audio" preload="metadata" src="Riot_On_An_Empty_Street.mp3" controls></audio>
</main>

<script>
  (function () {
    /* Build a sky-only mask from the photo, so drifting clouds pass behind the
       tree and rooftops. Same colour rule for every pixel; done once on load. */
    (function () {
      var img = document.getElementById('photo');
      var sky = document.getElementById('sky');
      function build() {
        try {
          var w = 512, h = Math.round(w * img.naturalHeight / img.naturalWidth);
          var c = document.createElement('canvas'); c.width = w; c.height = h;
          var x = c.getContext('2d'); x.drawImage(img, 0, 0, w, h);
          var d = x.getImageData(0, 0, w, h), px = d.data;
          var maxRow = Math.round(h * 0.372);
          for (var i = 0; i < px.length; i += 4) {
            var row = Math.floor((i / 4) / w);
            var r = px[i], g = px[i + 1], b = px[i + 2];
            var isSky = row < maxRow && b >= 80 && b - r >= 45 && b - g >= 25;
            px[i] = 255; px[i + 1] = 255; px[i + 2] = 255; px[i + 3] = isSky ? 255 : 0;
          }
          x.putImageData(d, 0, 0);
          var c2 = document.createElement('canvas'); c2.width = w; c2.height = h;
          var x2 = c2.getContext('2d');
          if ('filter' in x2) x2.filter = 'blur(1.4px)';
          x2.drawImage(c, 0, 0);
          var url = 'url(' + c2.toDataURL('image/png') + ')';
          sky.style.webkitMaskImage = url; sky.style.maskImage = url;
          sky.classList.add('ready');
        } catch (e) { /* no mask, no clouds: the still picture stays */ }
      }
      if (img.complete && img.naturalWidth) { build(); } else { img.addEventListener('load', build); }
    })();

    /* A falling star, just twice, somewhere quiet in the sky. Random
       position and timing so the two never feel like a pattern. */
    (function () {
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion) return;
      var sky = document.getElementById('sky');
      var remaining = 2;
      function schedule() {
        if (remaining <= 0) return;
        remaining--;
        var delay = 16000 + Math.random() * 34000;
        setTimeout(function () {
          var star = document.createElement('i');
          star.className = 'shooting-star';
          star.style.left = (8 + Math.random() * 55) + '%';
          star.style.top = (3 + Math.random() * 22) + '%';
          star.style.setProperty('--scale', (0.75 + Math.random() * 0.5).toFixed(2));
          star.style.animationDuration = (1 + Math.random() * 0.3).toFixed(2) + 's';
          sky.appendChild(star);
          star.addEventListener('animationend', function () { star.remove(); });
          schedule();
        }, delay);
      }
      schedule();
    })();

    var audio = document.getElementById('audio');
    var player = document.getElementById('player');
    var play = document.getElementById('play');
    var windowDim = document.getElementById('windowDim');

    audio.removeAttribute('controls');
    audio.hidden = true;

    audio.addEventListener('play', function () {
      player.classList.add('playing'); play.setAttribute('aria-label', 'Pauzeren');
      if (windowDim) windowDim.classList.remove('dimming');
    });
    audio.addEventListener('pause', function () {
      player.classList.remove('playing'); play.setAttribute('aria-label', 'Afspelen');
    });
    audio.addEventListener('ended', function () {
      audio.currentTime = 0;
      if (windowDim) windowDim.classList.add('dimming');
    });

    play.addEventListener('click', function () {
      if (audio.paused) { audio.play(); } else { audio.pause(); }
    });
  })();
</script>
</body>
</html>
