<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1224">
<title>I am climbing barricades in empty streets at night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Figtree:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --night: #0b1224;
    --paper: #f7ecd4;
    --muted: rgba(247, 236, 212, 0.68);
    --lamp: #f1b65e;
    --lamp-ink: #1c1206;
    --glass: rgba(9, 15, 30, 0.58);
    --glass-line: rgba(247, 213, 150, 0.2);
    --track: rgba(247, 236, 212, 0.22);
    --font-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--paper);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
  }

  .scene {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--night);
    container-type: size;
  }
  /* The photo is drawn "cover", anchored 30% / 50%. Everything that moves sits
     inside this stage, so it stays locked to the picture at any screen size. */
  .stage {
    --w: max(100vw, 150vh);
    position: absolute;
    width: var(--w);
    height: calc(var(--w) / 1.5);
    left: calc((100vw - var(--w)) * 0.3);
    top: calc((100vh - var(--w) / 1.5) * 0.5);
  }
  @supports (width: 1cqw) {
    .stage {
      --w: max(100cqw, 150cqh);
      left: calc((100cqw - var(--w)) * 0.3);
      top: calc((100cqh - var(--w) / 1.5) * 0.5);
    }
  }
  .photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    user-select: none;
  }

  /* Clouds: soft wisps that drift behind the tree and rooftops. The mask is
     built from the photo itself (see script), so they only show in the sky. */
  .sky {
    position: absolute;
    inset: 0;
    overflow: hidden;
    opacity: 0;
    transition: opacity 2s ease;
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
  }
  .sky.ready { opacity: 1; }
  .cloud {
    position: absolute;
    left: 40%;
    top: var(--y);
    width: var(--wd);
    height: var(--h);
    opacity: var(--o);
    background:
      radial-gradient(ellipse 34% 60% at 22% 58%, rgba(104, 146, 204, 0.75), transparent 72%),
      radial-gradient(ellipse 30% 70% at 50% 42%, rgba(104, 146, 204, 0.65), transparent 72%),
      radial-gradient(ellipse 28% 55% at 78% 60%, rgba(104, 146, 204, 0.6), transparent 72%);
    will-change: transform;
    animation: drift var(--dur) linear var(--delay) infinite;
  }
  @keyframes drift {
    from { transform: translateX(-80%); }
    to   { transform: translateX(150%); }
  }

  .star {
    position: absolute;
    width: 0.5%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 244, 220, 0.95), rgba(255, 244, 220, 0) 70%);
    mix-blend-mode: screen;
    animation: twinkle var(--dur) ease-in-out var(--delay) infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; }
    45% { opacity: 0.85; }
    60% { opacity: 0.35; }
  }

  /* Lamp light: a warm glow that surges and dips, a darker veil that dips
     when the glow does, and a much softer wash over the lit wall. */
  .lamp-glow, .lamp-dim, .wall-glow {
    position: absolute;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .lamp-glow {
    left: 32.4%;
    top: 16.8%;
    width: 22%;
    aspect-ratio: 1;
    background: radial-gradient(circle, rgba(255, 208, 120, 0.85) 0%, rgba(255, 170, 70, 0.4) 34%, rgba(255, 150, 50, 0) 70%);
    mix-blend-mode: screen;
    opacity: 0.55;
    animation: flicker 9s linear infinite;
  }
  .lamp-dim {
    left: 32.4%;
    top: 16.8%;
    width: 40%;
    aspect-ratio: 1;
    background: radial-gradient(circle, rgba(6, 10, 24, 0.55) 0%, rgba(6, 10, 24, 0.25) 40%, rgba(6, 10, 24, 0) 70%);
    opacity: 0;
    animation: dip 9s linear infinite;
  }
  .wall-glow {
    left: 33%;
    top: 42%;
    width: 34%;
    aspect-ratio: 1 / 1.5;
    background: radial-gradient(ellipse, rgba(255, 160, 60, 0.32) 0%, rgba(255, 140, 40, 0.12) 45%, rgba(255, 140, 40, 0) 70%);
    mix-blend-mode: screen;
    opacity: 0.55;
    animation: flicker-soft 9s linear infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: 0.6; }
    3%   { opacity: 0.25; }
    5%   { opacity: 0.9; }
    8%   { opacity: 0.55; }
    22%  { opacity: 0.7; }
    24%  { opacity: 0.15; }
    25.5%{ opacity: 0.85; }
    27%  { opacity: 0.4; }
    30%  { opacity: 0.62; }
    48%  { opacity: 0.72; }
    52%  { opacity: 0.55; }
    70%  { opacity: 0.68; }
    71.5%{ opacity: 0.1; }
    73%  { opacity: 0.88; }
    74.5%{ opacity: 0.35; }
    77%  { opacity: 0.62; }
    90%  { opacity: 0.55; }
  }
  @keyframes dip {
    0%, 100% { opacity: 0; }
    3%   { opacity: 0.55; }
    5%   { opacity: 0; }
    24%  { opacity: 0.7; }
    25.5%{ opacity: 0; }
    27%  { opacity: 0.35; }
    30%  { opacity: 0; }
    71.5%{ opacity: 0.8; }
    73%  { opacity: 0; }
    74.5%{ opacity: 0.45; }
    77%  { opacity: 0; }
  }
  @keyframes flicker-soft {
    0%, 100% { opacity: 0.55; }
    3%   { opacity: 0.42; }
    5%   { opacity: 0.6; }
    24%  { opacity: 0.4; }
    25.5%{ opacity: 0.6; }
    40%  { opacity: 0.62; }
    52%  { opacity: 0.5; }
    71.5%{ opacity: 0.38; }
    73%  { opacity: 0.6; }
    85%  { opacity: 0.58; }
  }

  .veil {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to top, rgba(7, 12, 26, 0.86) 0%, rgba(7, 12, 26, 0.35) 42%, rgba(7, 12, 26, 0) 70%);
  }

  main {
    position: relative;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 22px;
    width: 100%;
    max-width: 34rem;
    margin-inline: auto;
    padding-inline: 20px;
    padding-block: 32px 44px;
  }

  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 600;
    font-size: clamp(2.3rem, 10.5vw, 3.6rem);
    line-height: 1.05;
    letter-spacing: -0.005em;
    text-wrap: balance;
    color: var(--paper);
    text-shadow: 0 2px 24px rgba(5, 9, 20, 0.7);
  }

  .player {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 18px;
    background: var(--glass);
    border: 1px solid var(--glass-line);
    border-radius: 14px;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  .play {
    flex: none;
    width: 54px;
    height: 54px;
    border: 0;
    border-radius: 50%;
    background: var(--lamp);
    color: var(--lamp-ink);
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: 0 0 0 0 rgba(241, 182, 94, 0);
    transition: box-shadow 0.4s ease, transform 0.12s ease;
  }
  .play:active { transform: scale(0.94); }
  .play:focus-visible, .seek:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
  .play svg { width: 21px; height: 21px; fill: currentColor; }
  .play .i-pause { display: none; }
  .playing .play .i-play { display: none; }
  .playing .play .i-pause { display: block; }
  .playing .play { box-shadow: 0 0 26px 4px rgba(241, 182, 94, 0.45); }

  .track { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .seek {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 22px;
    margin: 0;
    background: transparent;
    cursor: pointer;
    --pos: 0%;
  }
  .seek::-webkit-slider-runnable-track {
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(to right, var(--lamp) var(--pos), var(--track) var(--pos));
  }
  .seek::-moz-range-track { height: 3px; border-radius: 2px; background: var(--track); }
  .seek::-moz-range-progress { height: 3px; border-radius: 2px; background: var(--lamp); }
  .seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px;
    height: 15px;
    margin-top: -6px;
    border: 0;
    border-radius: 50%;
    background: var(--paper);
  }
  .seek::-moz-range-thumb { width: 15px; height: 15px; border: 0; border-radius: 50%; background: var(--paper); }
  .times {
    display: flex;
    justify-content: space-between;
    font-size: 0.8125rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  @media (min-width: 900px) {
    main {
      margin-inline: auto 8vw;
      justify-content: center;
      padding-block: 48px;
    }
    .veil {
      background:
        linear-gradient(to left, rgba(7, 12, 26, 0.6) 0%, rgba(7, 12, 26, 0) 55%),
        linear-gradient(to top, rgba(7, 12, 26, 0.5) 0%, rgba(7, 12, 26, 0) 40%);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .play { transition: none; }
    .cloud, .star, .lamp-glow, .lamp-dim, .wall-glow { animation: none; }
    .sky { display: none; }
  }
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
  <div class="stage">
    <img class="photo" id="photo" src="image.png" alt="" decoding="async">
    <div class="sky" id="sky">
      <i class="cloud" style="--y: 3%;  --wd: 30%; --h: 12%; --o: 0.5; --dur: 150s; --delay: -60s"></i>
      <i class="cloud" style="--y: 14%; --wd: 38%; --h: 13%; --o: 0.42; --dur: 210s; --delay: -170s"></i>
      <i class="cloud" style="--y: 23%; --wd: 26%; --h: 9%;  --o: 0.46; --dur: 125s; --delay: -20s"></i>
    </div>
    <i class="star" style="left: 61%; top: 5.7%;  --dur: 5s;   --delay: -1s"></i>
    <i class="star" style="left: 66.5%; top: 9.9%; --dur: 7s;   --delay: -3s"></i>
    <i class="star" style="left: 68.9%; top: 18%;  --dur: 6s;   --delay: -2s"></i>
    <div class="wall-glow"></div>
    <div class="lamp-glow"></div>
    <div class="lamp-dim"></div>
  </div>
  <div class="veil"></div>
</div>

<main>
  <h1>I am climbing barricades in empty streets at night</h1>

  <div class="player" id="player">
    <button class="play" id="play" type="button" aria-label="Afspelen">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg>
    </button>
    <div class="track">
      <input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="Positie in het liedje">
      <div class="times"><span id="cur">0:00</span><span id="dur">4:05</span></div>
    </div>
  </div>

  <audio id="audio" preload="metadata" src="Riot_On_An_Empty_Street.mp3" controls></audio>
</main>

<script>
  (function () {
    /* Build a sky-only mask from the photo, so drifting clouds pass behind the
       tree and rooftops. Same colour rule for every pixel; done once on load. */
    (function () {
      var img = document.getElementById('photo');
      var sky = document.getElementById('sky');
      function build() {
        try {
          var w = 512, h = Math.round(w * img.naturalHeight / img.naturalWidth);
          var c = document.createElement('canvas'); c.width = w; c.height = h;
          var x = c.getContext('2d'); x.drawImage(img, 0, 0, w, h);
          var d = x.getImageData(0, 0, w, h), px = d.data;
          var maxRow = Math.round(h * 0.372);
          for (var i = 0; i < px.length; i += 4) {
            var row = Math.floor((i / 4) / w);
            var r = px[i], g = px[i + 1], b = px[i + 2];
            var isSky = row < maxRow && b >= 80 && b - r >= 45 && b - g >= 25;
            px[i] = 255; px[i + 1] = 255; px[i + 2] = 255; px[i + 3] = isSky ? 255 : 0;
          }
          x.putImageData(d, 0, 0);
          var c2 = document.createElement('canvas'); c2.width = w; c2.height = h;
          var x2 = c2.getContext('2d');
          if ('filter' in x2) x2.filter = 'blur(1.4px)';
          x2.drawImage(c, 0, 0);
          var url = 'url(' + c2.toDataURL('image/png') + ')';
          sky.style.webkitMaskImage = url; sky.style.maskImage = url;
          sky.classList.add('ready');
        } catch (e) { /* no mask, no clouds: the still picture stays */ }
      }
      if (img.complete && img.naturalWidth) { build(); } else { img.addEventListener('load', build); }
    })();

    var audio = document.getElementById('audio');
    var player = document.getElementById('player');
    var play = document.getElementById('play');
    var seek = document.getElementById('seek');
    var cur = document.getElementById('cur');
    var dur = document.getElementById('dur');
    var dragging = false;

    audio.removeAttribute('controls');
    audio.hidden = true;

    function fmt(s) {
      if (!isFinite(s)) return '0:00';
      var m = Math.floor(s / 60), r = Math.floor(s % 60);
      return m + ':' + (r < 10 ? '0' : '') + r;
    }
    function paint() {
      var d = audio.duration || 0;
      var p = d ? (audio.currentTime / d) * 1000 : 0;
      if (!dragging) seek.value = p;
      seek.style.setProperty('--pos', (p / 10) + '%');
      cur.textContent = fmt(audio.currentTime);
    }
    audio.addEventListener('loadedmetadata', function () { dur.textContent = fmt(audio.duration); });
    audio.addEventListener('timeupdate', paint);
    audio.addEventListener('play', function () {
      player.classList.add('playing'); play.setAttribute('aria-label', 'Pauzeren');
    });
    audio.addEventListener('pause', function () {
      player.classList.remove('playing'); play.setAttribute('aria-label', 'Afspelen');
    });
    audio.addEventListener('ended', function () { audio.currentTime = 0; paint(); });

    play.addEventListener('click', function () {
      if (audio.paused) { audio.play(); } else { audio.pause(); }
    });
    seek.addEventListener('input', function () {
      dragging = true;
      var d = audio.duration || 0;
      seek.style.setProperty('--pos', (seek.value / 10) + '%');
      cur.textContent = fmt((seek.value / 1000) * d);
    });
    seek.addEventListener('change', function () {
      var d = audio.duration || 0;
      audio.currentTime = (seek.value / 1000) * d;
      dragging = false;
    });
  })();
</script>
</body>
</html>
